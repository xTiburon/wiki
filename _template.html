<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
  ╔══════════════════════════════════════════════════════════════╗
  ║   _template.html  —  Plantilla base para páginas de la Wiki  ║
  ║   PlanetMC Wiki                                              ║
  ║                                                              ║
  ║   INSTRUCCIONES PARA CREAR UNA NUEVA PÁGINA:                 ║
  ║   1. Copia este archivo a pages/tu-pagina.html                ║
  ║      (TODAS las páginas viven en pages/, sin subcarpetas —    ║
  ║      así ROOT_PATH siempre es '../').                         ║
  ║   2. No hace falta tocar el <title>: layout.js lo pisa solo   ║
  ║      con el nombre que pongas en data/wiki-data.js.           ║
  ║   3. El <body> de este archivo NO cambia nunca — el contenido ║
  ║      real de la página NO va acá, va como HTML dentro del     ║
  ║      campo "content" de tu página en data/wiki-data.js.       ║
  ║   4. Agregá tu página (id, name, icon, path, description,     ║
  ║      keywords, content) dentro de una categoría — o en        ║
  ║      standalonePages si no pertenece a ninguna — en            ║
  ║      data/wiki-data.js.                                       ║
  ║   5. El breadcrumb, la barra lateral y el índice de la página ║
  ║      (TOC) se generan solos. No los escribas a mano.          ║
  ║                                                                ║
  ║   CLASES DE CONTENIDO DISPONIBLES (usalas dentro de "content"):║
  ║   .page-hero + .page-hero-icon + .page-hero-desc  → cabecera  ║
  ║   .alert.alert-info / .alert-warn / .alert-danger / .alert-todo║
  ║   .info-card > .info-card-row > .info-label / .info-val       ║
  ║   .ip-chip.ip-copy[data-ip]   → IP copiable al clic            ║
  ║   .wiki-list                  → lista con viñetas              ║
  ║   .wiki-steps                 → lista numerada de pasos        ║
  ║   .cmd-grid > .cmd-item       → grid de comandos               ║
  ║   .table-wrap > table.wiki-table → tabla estilizada            ║
  ║   .faq-list > details.faq-item > summary + p → acordeón FAQ    ║
  ║   .two-col                    → dos columnas lado a lado       ║
  ║   .feature-grid > .feature-card (icon/title/desc) → destacados ║
  ║   .item-grid > .item-chip     → chips de ítems                 ║
  ║   .rank-grid > .rank-item.rank-default/member/vip/mvp/elite    ║
  ║   .wiki-btn.wiki-btn-primary / .discord-btn → botones grandes  ║
  ║                                                                ║
  ║   "alert-todo" es para marcar contenido sin confirmar todavía  ║
  ║   (ej: un dato de un plugin que falta verificar en el server). ║
  ╚══════════════════════════════════════════════════════════════╝
  -->

  <title>PlanetMC Wiki</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<div id="content-slot"></div>

<script>window.ROOT_PATH = '../';</script>
<script src="../assets/js/icons.js"></script>
<script src="../data/wiki-data.js"></script>
<script src="../components/layout.js"></script>
<script src="../assets/js/search.js"></script>
<script src="../assets/js/background.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
